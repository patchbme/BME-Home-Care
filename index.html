<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ระบบแจ้งซ่อมบ้าน & มอบหมายงาน</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2733; --muted:#6b7688;
    --line:#e6e9f0; --brand:#3557d6; --brand-d:#2843ad; --brand-soft:#eaefff;
    --ok:#1e9e6a; --ok-soft:#e3f6ee; --warn:#d98a00; --warn-soft:#fdf3dd;
    --danger:#d63c4a; --danger-soft:#fde7e9; --info:#2c8cc4; --info-soft:#e4f3fb;
    --purple:#7a52d1; --purple-soft:#efe8fc;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Noto Sans Thai","Sarabun",-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  /* Layout */
  .app{display:flex; min-height:100vh}
  .sidebar{
    width:230px; background:#0f1836; color:#c9d3ee; padding:20px 14px;
    display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh;
    flex-shrink:0;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 16px; color:#fff}
  .brand .logo{
    width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#4f77ff,#7a52d1);
    display:grid;place-items:center;font-size:20px;flex-shrink:0;
  }
  .brand b{font-size:15px;line-height:1.2;display:block}
  .brand span{font-size:11.5px;color:#8fa0cc}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
    cursor:pointer;color:#c9d3ee;font-size:14px;font-weight:500;border:none;background:none;
    width:100%;text-align:right;transition:.15s;
  }
  .nav-item:hover{background:#1b2648;color:#fff}
  .nav-item.active{background:var(--brand);color:#fff}
  .nav-item .ic{font-size:17px;width:20px;text-align:center}
  .nav-item .badge{margin-inline-start:auto;background:#e9483d;color:#fff;font-size:11px;padding:1px 7px;border-radius:20px;font-weight:700}
  .nav-sep{height:1px;background:#22305c;margin:10px 6px}
  .side-foot{margin-top:auto;font-size:11px;color:#7d8dbd;padding:8px}
  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    background:var(--card);border-bottom:1px solid var(--line);padding:14px 26px;
    display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;
  }
  .topbar h1{font-size:18px;margin:0;font-weight:700}
  .topbar .sub{color:var(--muted);font-size:12.5px}
  .topbar .spacer{flex:1}
  .content{padding:22px 26px;max-width:1240px;width:100%;margin:0 auto}
  /* Buttons */
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:9px 15px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:#c8d0e0;background:#fafbff}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-d)}
  .btn.ghost{background:transparent;border-color:transparent}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .btn.danger{color:var(--danger);border-color:#f3ccd0}
  .btn.danger:hover{background:var(--danger-soft)}
  /* Cards & grid */
  .grid{display:grid;gap:16px}
  .stat-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .stat{padding:18px 18px}
  .stat .lab{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
  .stat .num{font-size:30px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
  .stat .foot{font-size:11.5px;color:var(--muted);margin-top:3px}
  .stat .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  /* Sections */
  .sec-title{font-size:15px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
  .sec-title:first-child{margin-top:4px}
  .two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
  @media(max-width:900px){.two-col{grid-template-columns:1fr}}
  /* Bars */
  .bar-row{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px}
  .bar-row .name{width:120px;flex-shrink:0;color:var(--ink)}
  .bar-track{flex:1;height:10px;background:#eef1f7;border-radius:20px;overflow:hidden}
  .bar-fill{display:block;height:100%;border-radius:20px;min-width:2px}
  .bar-row .val{width:34px;text-align:left;font-weight:700;color:var(--muted)}
  /* Table */
  table{width:100%;border-collapse:collapse}
  thead th{
    text-align:right;font-size:12px;color:var(--muted);font-weight:700;
    padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafbff;cursor:pointer}
  .tbl-wrap{overflow-x:auto}
  /* Chips */
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .chip .d{width:7px;height:7px;border-radius:50%}
  .st-new{background:var(--info-soft);color:#1c6d99}
  .st-assigned{background:var(--purple-soft);color:#5b39a8}
  .st-progress{background:var(--warn-soft);color:#9a6300}
  .st-parts{background:#fde8de;color:#b45516}
  .st-work{background:#dff3ea;color:#12805a}
  .st-done{background:var(--ok-soft);color:#146c48}
  .st-cancel{background:#eef0f4;color:#727d90}
  .pr-urgent{background:var(--danger-soft);color:#b02b38}
  .pr-high{background:var(--warn-soft);color:#9a6300}
  .pr-normal{background:#eaf0fb;color:#3557d6}
  /* Toolbar */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .input,select,textarea{
    font-family:inherit;font-size:14px;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;
  }
  .input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .search{position:relative;flex:1;min-width:190px}
  .search .input{padding-inline-start:34px}
  .search .mag{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
  select.mini{width:auto;padding:8px 11px;font-size:13px;font-weight:600}
  /* Form */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:700px){.form-grid{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1/-1}
  .field label{font-size:13px;font-weight:600}
  .field label .req{color:var(--danger)}
  .hint{font-size:11.5px;color:var(--muted)}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg-btn{
    border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;
    cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);
  }
  .seg-btn.on-urgent{background:var(--danger-soft);border-color:var(--danger);color:#b02b38}
  .seg-btn.on-high{background:var(--warn-soft);border-color:var(--warn);color:#9a6300}
  .seg-btn.on-normal{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-d)}
  .dropzone{
    border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;
    color:var(--muted);cursor:pointer;transition:.15s;background:#fafbff;
  }
  .dropzone:hover{border-color:var(--brand);color:var(--brand)}
  .thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .thumb{position:relative;width:82px;height:82px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .rm{position:absolute;top:3px;inset-inline-end:3px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:1}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(15,24,54,.45);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:var(--card);border-radius:16px;box-shadow:0 20px 60px rgba(16,24,40,.3);width:100%;max-width:640px;animation:pop .18s ease}
  @keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
  .modal-head .x{margin-inline-start:auto;background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
  .modal-body{padding:20px 22px;max-height:64vh;overflow:auto}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:13.5px;margin-bottom:4px}
  .kv .k{color:var(--muted);font-weight:600}
  .timeline{margin-top:6px;border-inline-start:2px solid var(--line);padding-inline-start:16px;display:flex;flex-direction:column;gap:14px}
  .tl-item{position:relative}
  .tl-item::before{content:"";position:absolute;inset-inline-start:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 2px var(--brand-soft)}
  .tl-item .when{font-size:11.5px;color:var(--muted)}
  .tl-item .what{font-size:13px}
  .gallery{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .gallery img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
  /* Techs */
  .tech-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .tech-card{padding:16px;display:flex;flex-direction:column;gap:10px}
  .tech-top{display:flex;align-items:center;gap:12px}
  .avatar{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px;flex-shrink:0}
  .tech-meta{font-size:12.5px;color:var(--muted)}
  .tech-load{font-size:12px}
  .empty{text-align:center;color:var(--muted);padding:44px 16px}
  .empty .ic{font-size:40px;opacity:.4}
  .tdrow{display:flex;gap:8px;align-items:center;padding:7px 2px;border-top:1px solid var(--line);cursor:pointer;font-size:13px}
  .tdrow:hover{background:#fafbff}
  .tdrow .c{font-weight:700;font-size:12px;white-space:nowrap;color:var(--muted)}
  .tdrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%) translateY(20px);background:#0f1836;color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:.25s;z-index:200;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .row-tools{display:flex;gap:6px}
  .mobile-only{display:none}
  @media(max-width:820px){
    .sidebar{position:fixed;z-index:60;transform:translateX(100%);transition:.2s;box-shadow:-4px 0 24px rgba(0,0,0,.2)}
    .sidebar.open{transform:none}
    .mobile-only{display:inline-flex}
    .content{padding:16px}
    .topbar{padding:12px 16px}
    .form-grid{grid-template-columns:1fr}
  }
  .hamb{background:none;border:1px solid var(--line);border-radius:9px;width:38px;height:38px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">🏠</div>
      <div><b>ระบบแจ้งซ่อมบ้าน</b><span>Home Repair & Dispatch</span></div>
    </div>
    <button class="nav-item active" data-view="today"><span class="ic">🏠</span> งานวันนี้</button>
    <button class="nav-item" data-view="dashboard"><span class="ic">📊</span> แดชบอร์ด</button>
    <button class="nav-item" data-view="new"><span class="ic">➕</span> แจ้งซ่อมใหม่</button>
    <button class="nav-item" data-view="jobs"><span class="ic">🗂️</span> รายการงาน <span class="badge" id="navBadge" style="display:none"></span></button>
    <button class="nav-item" data-view="board"><span class="ic">📋</span> บอร์ดสถานะ</button>
    <button class="nav-item" data-view="houses"><span class="ic">🏘️</span> ทะเบียนบ้าน</button>
    <button class="nav-item" data-view="techs"><span class="ic">👷</span> ทีมงาน</button>
    <div class="nav-sep"></div>
    <button class="nav-item" id="btnExport"><span class="ic">⬇️</span> บันทึกข้อมูล (JSON)</button>
    <button class="nav-item" id="btnImport"><span class="ic">⬆️</span> โหลดข้อมูล (JSON)</button>
    <button class="nav-item" id="btnSeed"><span class="ic">🎲</span> โหลดข้อมูลตัวอย่าง</button>
    <div class="side-foot">
      แผนกบริการลูกค้า → แผนกช่าง<br>เก็บข้อมูลในเครื่องผู้ใช้ (ไม่ส่งออกภายนอก)
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <button class="hamb mobile-only" id="hamb">☰</button>
      <div>
        <h1 id="viewTitle">แดชบอร์ด</h1>
        <div class="sub" id="viewSub">ภาพรวมงานซ่อมทั้งหมด</div>
      </div>
      <div class="spacer"></div>
      <span id="syncBadge" class="hint" style="margin-inline-end:12px;font-weight:600;white-space:nowrap"></span>
      <button class="btn primary" id="topAdd"><span>➕</span> แจ้งซ่อม</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- Job detail modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<input type="file" id="fileInput" accept="application/json" style="display:none" />
<div class="toast" id="toast"></div>

<!-- ค่าเชื่อมต่อคลาวด์ (แก้ที่ไฟล์ config.js เท่านั้น) -->
<script src="config.js"></script>
<script>
/* ============================================================
   ระบบแจ้งซ่อมบ้าน & มอบหมายงาน — Single-file app
   ข้อมูลเก็บในหน่วยความจำ + ส่งออก/นำเข้าไฟล์ JSON ได้
   ============================================================ */

// ---------- ค่าคงที่ ----------
const STATUSES = [
  {key:"new",       label:"แจ้งใหม่",              cls:"st-new",      color:"#2c8cc4"},
  {key:"inspect",   label:"นัดตรวจหน้างาน",        cls:"st-assigned", color:"#7a52d1"},
  {key:"quote",     label:"เสนอราคา/รอชำระเงิน",   cls:"st-parts",    color:"#c0632a"},
  {key:"paid",      label:"ชำระแล้ว/รอเข้าซ่อม",   cls:"st-progress", color:"#d98a00"},
  {key:"progress",  label:"กำลังดำเนินการ",        cls:"st-work",     color:"#2f8f5b"},
  {key:"done",      label:"เสร็จสิ้น",              cls:"st-done",     color:"#1e9e6a"},
  {key:"cancel",    label:"ยกเลิก",                cls:"st-cancel",   color:"#8a94a6"},
];
// รองรับสถานะเก่า (ข้อมูลนำเข้า): assigned→inspect, parts→quote
const STATUS_ALIAS = { assigned:"inspect", parts:"quote" };
const PRIORITIES = [
  {key:"urgent", label:"ด่วนมาก", cls:"pr-urgent", seg:"on-urgent", color:"#d63c4a", sla:4},
  {key:"high",   label:"ด่วน",    cls:"pr-high",   seg:"on-high",   color:"#d98a00", sla:24},
  {key:"normal", label:"ปกติ",    cls:"pr-normal", seg:"on-normal", color:"#3557d6", sla:72},
];
const CATEGORIES = ["ไฟฟ้า","ประปา","แอร์/เครื่องปรับอากาศ","โครงสร้าง/ผนัง","หลังคา/รั่วซึม","ประตู/หน้าต่าง","เฟอร์นิเจอร์","เครื่องใช้ไฟฟ้า","สวน/ภายนอก","อื่นๆ"];
// รายการโครงการมาตรฐาน (BE MORE Group)
const PROJECTS = ["พรีเชียส","ทาวน์โฮม","เพรสซิเด้น","อพาร์ตเมนต์ ตึก 1","อพาร์ตเมนต์ ตึก 2","คลับเฮ้าส์","เวนิวมาร์เก็ต","สำนักงานขายเดิม"];
function projectOptions(sel){
  const set=[...new Set([...PROJECTS, ...state.houses.map(h=>h.zone).filter(Boolean)])];
  return `<option value="">— เลือกโครงการ —</option>`+set.map(z=>`<option ${z===sel?'selected':''}>${esc(z)}</option>`).join('');
}
const AVATAR_COLORS = ["#3557d6","#1e9e6a","#d98a00","#7a52d1","#c0632a","#2c8cc4","#d63c4a","#0f9488"];

const statusOf = k => STATUSES.find(s=>s.key===(STATUS_ALIAS[k]||k)) || STATUSES[0];
const prioOf   = k => PRIORITIES.find(p=>p.key===k) || PRIORITIES[2];

let currentView = "today";
let draftImages = [];
let jobFilter = { q:"", status:"", prio:"", tech:"" };
let houseFilter = { q:"", zone:"" };

/* ========= ตั้งค่าเชื่อมต่อคลาวด์ (Google Apps Script) =========
   วาง URL เว็บแอป (ลงท้ายด้วย /exec) และรหัสลับให้ตรงกับใน Apps Script
   ถ้าเว้นว่างไว้ ระบบจะทำงานแบบออฟไลน์ (เก็บในเครื่อง) เหมือนเดิม     */
const CLOUD = (window.APP_CLOUD || { url:"", key:"" });
// ข้อมูลตั้งต้นที่ฝังไว้ (เปิดมาเห็นข้อมูลจริงทันที เมื่อยังไม่ต่อคลาวด์)
const SEED_DATA = {

const $ = s => document.querySelector(s);

const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function pad(n){return n<10?"0"+n:n}
function fmtDate(iso){
  if(!iso) return "-";
  const d=new Date(iso);
  const th=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  return `${d.getDate()} ${th[d.getMonth()]} ${(d.getFullYear()+543)%100} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function timeAgo(iso){
  const diff=(Date.now()-new Date(iso).getTime())/1000;
  if(diff<60) return "เมื่อสักครู่";
  if(diff<3600) return Math.floor(diff/60)+" นาทีที่แล้ว";
  if(diff<86400) return Math.floor(diff/3600)+" ชม.ที่แล้ว";
  return Math.floor(diff/86400)+" วันที่แล้ว";
}
function nowISO(){return new Date().toISOString()}
function jobCode(id){return "JOB-"+String(id).padStart(4,"0")}
function fmtBaht(n){ if(n==null||n==="")return "-"; return "฿"+Number(n).toLocaleString("th-TH"); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fmtDateShort(s){ if(!s)return "-"; const p=String(s).slice(0,10).split("-").map(Number); if(p.length<3)return s; const th=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."]; return `${p[2]} ${th[p[1]-1]} ${(p[0]+543)%100}`; }
function daysBetween(a,b){ if(!a||!b)return null; const d=(new Date(b.slice(0,10))-new Date(a.slice(0,10)))/86400000; return Math.round(d); }
function parseCost(v){ v=String(v==null?"":v).replace(/[,\s฿]/g,"").trim(); if(v==="")return null; const n=Number(v); return (isNaN(n)||n<0)?null:n; }

function isOverdue(j){
  if(["done","cancel"].includes(j.status)) return false;

}

const REAL_CS=["โปน","พี่เบิร์ด"];
const HOUSE_COUNT=124;
const HOUSE_ZONES=["โซน A","โซน B","โซน C","โซน D"];
function initTeam(){
  state={ jobs:[], techs:[], cs:[], houses:[], seq:1 };
  state.techs=REAL_TECHS.map(n=>({id:"t"+(state.seq++),name:n,skill:"",phone:""}));
  state.cs=REAL_CS.map(n=>({id:"c"+(state.seq++),name:n}));
  const per=Math.ceil(HOUSE_COUNT/HOUSE_ZONES.length);
  for(let i=1;i<=HOUSE_COUNT;i++){
    state.houses.push({id:"h"+(state.seq++), no:String(i), zone:HOUSE_ZONES[Math.min(HOUSE_ZONES.length-1,Math.floor((i-1)/per))], owner:"", phone:""});
  }
}

// ---------- คงอยู่ (in-memory + ส่งออก/นำเข้าไฟล์) ----------
function save(){
  if(!cloudOn) return; // ออฟไลน์: ใช้ปุ่มบันทึก/โหลด JSON เพื่อเก็บถาวร
  clearTimeout(saveTimer);
  setSync('saving');
  saveTimer=setTimeout(()=>{ saveTimer=null; cloudSaveNow().then(()=>setSync('ok')).catch(()=>setSync('err')); }, 700);
}
function cloudUrlKey(){ return CLOUD.url + (CLOUD.url.includes('?')?'&':'?') + 'key=' + encodeURIComponent(CLOUD.key); }
async function cloudLoad(initial){
  const r=await fetch(cloudUrlKey());
  const d=await r.json();
  if(!d||!d.ok) throw new Error((d&&d.error)||'load failed');
  if(d.state){ state=d.state; if(!state.cs)state.cs=[]; if(!state.houses)state.houses=[]; if(!state.techs)state.techs=[]; }
  else if(initial){
    // เชื่อมคลาวด์ครั้งแรก (ชีตยังว่าง) → อัปโหลดข้อมูลที่ฝังไว้ (นำเข้าแล้ว) ขึ้นเป็นชุดเริ่มต้น
    if(typeof SEED_DATA!=='undefined' && SEED_DATA){ state=SEED_DATA; if(!state.cs)state.cs=[]; if(!state.houses)state.houses=[]; if(!state.techs)state.techs=[]; }
    else initTeam();
    await cloudSaveNow();
  }
  return true;
}
function cloudSaveNow(){
  return fetch(CLOUD.url,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({key:CLOUD.key, action:'save', state}) }).then(r=>r.json());
}
function cloudNotify(text,to){
  if(!cloudOn||!text) return;
  fetch(CLOUD.url,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({key:CLOUD.key, action:'notify', text, to:to||""}) }).catch(()=>{});
}
function setSync(s){
  const b=$("#syncBadge"); if(!b) return;
  if(!cloudOn){ b.textContent="💾 ออฟไลน์"; b.title="เก็บข้อมูลในเครื่อง — ใช้ปุ่มบันทึก/โหลด JSON"; b.style.color="var(--muted)"; return; }
  const map={ok:["☁️ ซิงก์แล้ว","var(--ok)"],saving:["⏳ กำลังบันทึก…","var(--warn)"],err:["⚠️ ซิงก์ไม่สำเร็จ","var(--danger)"],loading:["⏳ กำลังโหลด…","var(--muted)"]};
  const m=map[s]||map.ok; b.textContent=m[0]; b.style.color=m[1];
}
function startPolling(){
  clearInterval(polling);
  polling=setInterval(async ()=>{
    if(!cloudOn) return;
    if(document.querySelector('.overlay.show')) return; // กำลังเปิดหน้าต่างแก้ไข
    if(currentView==='new') return;                     // กำลังกรอกฟอร์มแจ้งซ่อม
    if(saveTimer) return;                               // มีการบันทึกค้างอยู่
    try{ const before=JSON.stringify(state); await cloudLoad(false); if(JSON.stringify(state)!==before) render(); setSync('ok'); }
    catch(e){ setSync('err'); }
  }, 12000);
}
async function boot(){
  cloudOn = !!(CLOUD.url && CLOUD.url.trim());
  if(cloudOn){
    setSync('loading');
    try{ await cloudLoad(true); render(); setSync('ok'); startPolling(); return; }
    catch(e){ cloudOn=false; toast('เชื่อมต่อคลาวด์ไม่สำเร็จ ใช้งานแบบออฟไลน์ชั่วคราว'); }
  }
  if(typeof SEED_DATA!=='undefined' && SEED_DATA){ state=SEED_DATA; if(!state.cs)state.cs=[]; if(!state.houses)state.houses=[]; if(!state.techs)state.techs=[]; render(); setSync(); return; }
  initTeam(); render(); setSync();
}

function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const d=new Date();
  a.href=url; a.download=`repair-data-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast("บันทึกไฟล์ข้อมูลแล้ว");
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(!d.jobs||!d.techs) throw 0;
    if(!d.cs) d.cs=[];
    if(!d.houses) d.houses=[];
    state=d; render(); toast("นำเข้าข้อมูลสำเร็จ");
  }catch(e){ toast("ไฟล์ไม่ถูกต้อง"); } };
  r.readAsText(file);
}

    [...files].forEach(f=>{ if(!f.type.startsWith("image/"))return;

      estCost:parseCost(g("#f_est")), actualCost:null, cost:null, warranty:false,
      quoteNo:"", receiptNo:"", paidDate:null, receivedBy:rc,
      dateReported:g("#f_date")||todayStr(), dateAssessed:null, dateRepaired:null, dateDone:null,
      houseId, techId, images:[...draftImages], createdAt:nowISO(), updatedAt:nowISO(),
      timeline:[{at:nowISO(),text:"รับแจ้งงานจากลูกค้า",by:rc}] };

    state.jobs.unshift(j); save();

    toast("บันทึกคำร้อง "+j.code+" แล้ว"); currentView="jobs"; render();
  };
}

function statusChip(k){const s=statusOf(k);return `<span class="chip ${s.cls}"><span class="d" style="background:${s.color}"></span>${s.label}</span>`;}
function prioChip(k){const p=prioOf(k);return `<span class="chip ${p.cls}">${p.label}</span>`;}
function lineMessage(j){
  const t=techById(j.techId), h=houseById(j.houseId);
  const L=[];
  L.push(`🔧 แจ้งงานซ่อม ${j.code}`);
  L.push(`🏠 ${j.unit||""}${(h&&h.zone)?` (${h.zone})`:(j.location?` (${j.location})`:"")}`);
  L.push(`📋 ${j.title}`);
  L.push(`${j.prio==='urgent'?'🚨 ด่วนมาก':j.prio==='high'?'⚠️ ด่วน':'🔵 ปกติ'} · สถานะ: ${statusOf(j.status).label}`);
  L.push(`👤 ผู้แจ้ง: ${j.customer||"-"} ${j.phone||""}`.trim());
  L.push(`👷 ช่าง: ${t?t.name:"ยังไม่มอบหมาย"}`);
  if(j.desc) L.push(`📝 ${j.desc}`);
  const dd=j.dateRepaired||j.dateAssessed;
  if(dd) L.push(`📅 นัด/เข้างาน: ${fmtDateShort(dd)}`);
  if(j.estCost!=null) L.push(`💰 ประเมิน: ${fmtBaht(j.estCost)}`);
  return L.join("\n");
}
function shareToLine(j){
  const txt=lineMessage(j);
  try{ if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast("คัดลอกข้อความแล้ว — เลือกกลุ่มไลน์เพื่อวาง")); else toast("เปิดไลน์เพื่อส่งข้อความ"); }
  catch(e){ toast("เปิดไลน์เพื่อส่งข้อความ"); }
  window.open("https://line.me/R/msg/text/?"+encodeURIComponent(txt),"_blank");
}

function openHouse(id){

  const totalCost=jobs.reduce((s,j)=>s+(j.actualCost||0),0);
  const rows=jobs.length?jobs.map(j=>`<tr data-job="${j.id}" style="cursor:pointer">
      <td style="font-weight:700;white-space:nowrap">${j.code}</td>
      <td>${esc(j.title)}</td>
      <td>${statusChip(j.status)}</td>
      <td class="hint" style="white-space:nowrap">${fmtDateShort(j.dateReported||j.createdAt)}</td>

2, พรีเชียส, คุณมาลี, 082-222-2222"></textarea>

  `);
  $("#impDo").onclick=()=>{
    const lines=$("#imp").value.split("\n").map(l=>l.trim()).filter(Boolean);
    let added=0,updated=0;
    lines.forEach(l=>{

      if(!no) return;
      const ex=state.houses.find(h=>h.no===no);
      if(ex){ ex.zone=zone||ex.zone; ex.owner=owner||ex.owner; ex.phone=phone||ex.phone; updated++; }
      else { state.houses.push({id:"h"+(state.seq++),no,zone:zone||"",owner:owner||"",phone:phone||""}); added++; }
    });
    save(); closeModal(); render(); toast(`นำเข้าสำเร็จ (เพิ่ม ${added}, อัปเดต ${updated})`);

      <button class="btn primary" id="applyUpdate" style="margin-top:14px">💾 บันทึกการเปลี่ยนแปลง</button>

      <div class="sec-title" style="margin:20px 0 6px">🕒 ประวัติการดำเนินงาน</div>
      <div class="timeline" id="tl">
        ${[...j.timeline].reverse().map(e=>`<div class="tl-item"><div class="what">${esc(e.text)}</div><div class="when">${fmtDate(e.at)} · โดย ${esc(e.by)}</div></div>`).join("")}
      </div>
    </div>
    <div class="modal-foot">
      ${!["done","cancel"].includes(j.status)?`<button class="btn" id="closeJob" style="color:var(--ok);border-color:#bfe6d3;background:var(--ok-soft)">✅ ปิดงาน — เสร็จเรียบร้อย</button>`:`<span class="chip st-done" style="align-self:center">✅ ปิดงานแล้ว${j.dateDone?" · "+fmtDateShort(j.dateDone):""}</span>`}
      <button class="btn" id="lineJob" style="color:#06c755;border-color:#b7e9c9">💬 ส่งเข้าไลน์</button>
      <div class="spacer" style="flex:1"></div>
      <button class="btn danger" id="delJob">🗑️ ลบงานนี้</button>
      <button class="btn" onclick="closeModal()">ปิด</button>
    </div>
  `);
  $("#lineJob").onclick=()=>shareToLine(j);

  $("#applyUpdate").onclick=()=>{
    const newTech=$("#m_tech").value||null;
    let newStatus=$("#m_status").value;
    const newPrio=$("#m_prio").value;
    const newEst=parseCost($("#m_est").value);
    const newAct=parseCost($("#m_act").value);
    const newCost=parseCost($("#m_cost").value);
    const newWarranty=$("#m_warranty").value==="yes";
    const newQuote=$("#m_quote").value.trim();
    const newReceipt=$("#m_receipt").value.trim();
    const newPaid=$("#m_paid").value||null;
    const nDrep=$("#m_drep").value||null, nDass=$("#m_dass").value||null, nDrepair=$("#m_drepair").value||null, nDdone=$("#m_ddone").value||null;
    const note=$("#m_note").value.trim();
    const events=[];
    const techChanged=newTech!==j.techId;
    if(techChanged){
      events.push(newTech?`มอบหมายให้ ${techById(newTech).name}`:"ยกเลิกการมอบหมาย");
      // ถ้าเพิ่งมอบหมายช่างขณะที่ยังเป็น "แจ้งใหม่" และผู้ใช้ไม่ได้เปลี่ยนสถานะเอง → เลื่อนเป็น "มอบหมายแล้ว"
      if(newTech && j.status==="new" && newStatus==="new") newStatus="inspect";
      j.techId=newTech;
    }
    if(newStatus!==j.status){ events.push("เปลี่ยนสถานะเป็น “"+statusOf(newStatus).label+"”"); j.status=newStatus; }
    if(newPrio!==j.prio){ j.prio=newPrio; events.push("ปรับความเร่งด่วนเป็น “"+prioOf(newPrio).label+"”"); }
    if(newEst!==j.estCost){ j.estCost=newEst; events.push(newEst!=null?"ประเมินค่าใช้จ่าย "+fmtBaht(newEst):"ล้างค่าประเมิน"); }
    if(newAct!==j.actualCost){ j.actualCost=newAct; events.push(newAct!=null?"บันทึกค่าบริการที่เรียกเก็บ "+fmtBaht(newAct):"ล้างค่าบริการ"); }
    if(newCost!==(j.cost??null)){ j.cost=newCost; events.push(newCost!=null?"บันทึกต้นทุนงาน "+fmtBaht(newCost):"ล้างต้นทุน"); }
    if(newWarranty!==!!j.warranty){ j.warranty=newWarranty; events.push(newWarranty?"ทำเครื่องหมาย “อยู่ในประกัน”":"ยกเลิก “อยู่ในประกัน”"); }
    if(newQuote!==(j.quoteNo||"")){ j.quoteNo=newQuote; if(newQuote) events.push("ออกใบเสนอราคา "+newQuote); }
    if(newPaid!==(j.paidDate||null)){ j.paidDate=newPaid; if(newPaid) events.push("รับชำระเงิน "+fmtDateShort(newPaid)); }
    if(newReceipt!==(j.receiptNo||"")){ j.receiptNo=newReceipt; if(newReceipt) events.push("ออกใบเสร็จ "+newReceipt); }
    [["dateReported",nDrep,"วันที่แจ้งซ่อม"],["dateAssessed",nDass,"วันที่เข้าประเมินหน้างาน"],["dateRepaired",nDrepair,"วันที่เข้าซ่อม"],["dateDone",nDdone,"วันที่งานเสร็จ"]].forEach(([k,v,lb])=>{ const cur=(j[k]||"").slice(0,10)||null; if((v||null)!==cur){ j[k]=v||null; events.push(v?lb+" = "+fmtDateShort(v):"ล้าง"+lb); } });
    // เติมวันที่อัตโนมัติตามสถานะ
    if(j.status==="progress" && !j.dateRepaired){ j.dateRepaired=todayStr(); events.push("บันทึกวันที่เข้าซ่อม (อัตโนมัติ) "+fmtDateShort(j.dateRepaired)); }
    if(j.status==="done" && !j.dateDone){ j.dateDone=todayStr(); events.push("บันทึกวันที่งานเสร็จ (อัตโนมัติ) "+fmtDateShort(j.dateDone)); }
    if(note) events.push("บันทึก: "+note);
    if(events.length===0){ toast("ไม่มีการเปลี่ยนแปลง"); return; }
    events.forEach(txt=>j.timeline.push({at:nowISO(),text:txt,by:"เจ้าหน้าที่"}));
    j.updatedAt=nowISO(); save();
    if(techChanged && j.techId) cloudNotify(lineMessage(j), techById(j.techId).lineId);
    closeModal(); render(); toast("อัปเดต "+j.code+" แล้ว");
  };
  const cj=$("#closeJob"); if(cj) cj.onclick=()=>{
    if(!j.techId){ toast("กรุณามอบหมายช่างก่อนปิดงาน"); return; }
    j.status="done"; if(!j.dateDone) j.dateDone=todayStr();
    if(!j.dateRepaired) j.dateRepaired=j.dateDone;
    j.timeline.push({at:nowISO(),text:"ปิดงาน — เสร็จเรียบร้อย ("+fmtDateShort(j.dateDone)+")",by:"เจ้าหน้าที่"});
    j.updatedAt=nowISO(); save(); closeModal(); render(); toast("ปิดงาน "+j.code+" เรียบร้อย ✅");
  };
  $("#delJob").onclick=()=>{
    state.jobs=state.jobs.filter(x=>x.id!==id); save(); closeModal(); render(); toast("ลบงาน "+j.code+" แล้ว");
  };
  const hl=$("#hLink"); if(hl) hl.onclick=(e)=>{ e.preventDefault(); openHouse(j.houseId); };
}

/* ---------- shared ---------- */
function emptyState(title,sub,seedBtn){
  const d=el("div","card empty");
  d.innerHTML=`<div class="ic">📭</div><div style="font-weight:700;font-size:16px;margin-top:8px">${esc(title)}</div><div class="hint" style="margin-top:4px">${esc(sub)}</div>`;
  if(seedBtn){ const b=el("button","btn primary","🎲 โหลดข้อมูลตัวอย่าง"); b.style.marginTop="16px"; b.onclick=seedData; d.appendChild(b); }
  return d;
}
function showModal(html){ $("#modal").innerHTML=html; $("#overlay").classList.add("show"); }
function closeModal(){ $("#overlay").classList.remove("show"); }
$("#overlay").onclick=e=>{ if(e.target===$("#overlay")) closeModal(); };

/* ---------- nav & init ---------- */
document.querySelectorAll(".nav-item[data-view]").forEach(n=>{
  n.onclick=()=>{ currentView=n.dataset.view; if(currentView==="jobs") {} render(); $("#sidebar").classList.remove("open"); };
});
$("#topAdd").onclick=()=>{ currentView="new"; render(); };
$("#hamb").onclick=()=>$("#sidebar").classList.toggle("open");
$("#btnExport").onclick=exportData;
$("#btnImport").onclick=()=>$("#fileInput").click();
$("#fileInput").onchange=e=>{ if(e.target.files[0]) importData(e.target.files[0]); e.target.value=""; };
$("#btnSeed").onclick=seedData;

boot();
